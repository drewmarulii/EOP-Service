server:
  port: 8084

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/eop-v
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
      show-sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

user-service:
  url: http://localhost:8081