server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/user-profiles/**, /api/auth/**
        - id: attendance-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/attendances/**
        - id: event-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/events/**, /api/liturgies/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
